version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      # uv keeps memory usage low enough for RTD builders, unlike pip,
      # which gets OOM-killed installing the jax/ott dependency stack.
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv pip install .[docs]

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: true

submodules:
  include: [docs/notebooks]
  recursive: true
