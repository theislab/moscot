version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_create_environment:
      # Install moscot without its heavy ML backend (jax/ott/flax/optax/diffrax).
      # Those packages are mocked via autodoc_mock_imports in docs/conf.py.
      - pip install --no-deps .
      - pip install -r docs/rtd-requirements.txt

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: true

submodules:
  include: [docs/notebooks]
  recursive: true
